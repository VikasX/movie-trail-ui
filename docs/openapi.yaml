              example:
                error:
                  code: authentication_required
                  message: Authentication required
                  fields: {}
                  request_id: req-example
        '403':
          description: CSRF or policy denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: permission_denied
                  message: CSRF or policy denied
                  fields: {}
                  request_id: req-example
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: conflict
                  message: Conflict
                  fields: {}
                  request_id: req-example
        '413':
          description: Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: payload_too_large
                  message: Request too large
                  fields: {}
                  request_id: req-example
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: rate_limited
                  message: Rate limited
                  fields: {}
                  request_id: req-example
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              example: 30
        '502':
          description: Invalid upstream response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: upstream_invalid
                  message: Invalid upstream response
