          items:
            $ref: '#/components/schemas/Mood'
        mood_mapping_version:
          type: string
        attribution:
          type: object
          additionalProperties: false
          properties:
            tmdb_notice:
              type: string
            tmdb_url:
              type: string
              format: uri
            watch_providers:
              type: string
          required:
          - tmdb_notice
          - tmdb_url
          - watch_providers
      required:
      - genres
      - languages
      - regions
      - moods
      - mood_mapping_version
      - attribution
      example:
        genres:
        - key: drama
          name: Drama
        languages:
        - code: en
          name: English
        regions:
        - code: IN
          name: India
        moods:
        - key: feel_good
          label: Feel-Good
          genre_keys:
          - comedy
          - animation
          - family
          keyword_ids: []
        - key: mind_bending
          label: Mind-Bending
          genre_keys:
          - sci-fi
          - mystery
          - fantasy
          keyword_ids: []
        - key: dark
          label: Dark
          genre_keys:
          - thriller
          - horror
          - crime
          keyword_ids: []
        - key: relaxing
          label: Relaxing
          genre_keys:
          - comedy
          - family
          - documentary
          keyword_ids: []
        - key: family_night
          label: Family Night
          genre_keys:
          - animation
          - family
          keyword_ids: []
        mood_mapping_version: moods-v2
        attribution:
          tmdb_notice: This product uses the TMDB API but is not endorsed or certified by TMDB.
          tmdb_url: https://www.themoviedb.org
          watch_providers: JustWatch
    Option:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        name:
          type: string
      required:
      - code
      - name
      example:
        code: en
        name: English
    GuestSaved:
      type: object
      additionalProperties: false
      properties:
        media_type:
          type: string
          enum:
          - movie
          - tv
        tmdb_id:
          type: integer
          minimum: 1
        watched:
          type: boolean
        saved_at:
          type: string
          format: date-time
        watched_at:
          type: string
          format: date-time
          nullable: true
      required:
      - media_type
      - tmdb_id
      - watched
      - saved_at
      - watched_at
      example:
        media_type: movie
        tmdb_id: 550
        watched: true
        saved_at: '2026-11-18T10:00:00Z'
        watched_at: '2026-11-18T10:00:00Z'
    GuestCollection:
      type: object
      additionalProperties: false
      properties:
        client_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        items:
          type: array
          items:
            $ref: '#/components/schemas/TitleRef'
          maxItems: 500
          uniqueItems: true
      required:
      - client_id
      - name
      - items
      example:
        client_id: 0b04e83e-f4ef-44db-840e-9b494f007c99
        name: Weekend picks
        items:
        - media_type: movie
          tmdb_id: 550
    SyncInput:
      type: object
      additionalProperties: false
      properties:
        sync_id:
          type: string
          format: uuid
        guest_id:
          type: string
          format: uuid
        saved_titles:
          type: array
          items:
            $ref: '#/components/schemas/GuestSaved'
          maxItems: 500
        collections:
          type: array
          items:
            $ref: '#/components/schemas/GuestCollection'
          maxItems: 20
      required:
      - sync_id
      - guest_id
      - saved_titles
      - collections
      example:
        sync_id: d660fc0b-25be-4ea1-9a70-d8b45b4efc24
        guest_id: 0b04e83e-f4ef-44db-840e-9b494f007c99
        saved_titles:
        - media_type: movie
          tmdb_id: 550
          watched: true
          saved_at: '2026-11-18T10:00:00Z'
          watched_at: '2026-11-18T10:00:00Z'
        collections:
        - client_id: 0b04e83e-f4ef-44db-840e-9b494f007c99
          name: Weekend picks
          items:
          - media_type: movie
            tmdb_id: 550
    CollectionMapping:
      type: object
      additionalProperties: false
      properties:
        client_id:
          type: string
          format: uuid
        collection_id:
          type: string
          format: uuid
      required:
      - client_id
      - collection_id
      example:
        client_id: 0b04e83e-f4ef-44db-840e-9b494f007c99
        collection_id: 0b04e83e-f4ef-44db-840e-9b494f007c99
    SyncRejected:
      type: object
      additionalProperties: false
      properties:
        title:
          $ref: '#/components/schemas/TitleRef'
        code:
          type: string
          enum:
          - title_unavailable
          - adult_title
      required:
      - title
      - code
      example:
        title:
          media_type: tv
          tmdb_id: 999999
        code: title_unavailable
    SyncResult:
      type: object
      additionalProperties: false
      properties:
        sync_id:
          type: string
          format: uuid
        saved_created:
          type: integer
          minimum: 0
        saved_merged:
          type: integer
          minimum: 0
        collections_created:
          type: integer
          minimum: 0
        memberships_created:
          type: integer
          minimum: 0
        collection_mappings:
          type: array
          items:
            $ref: '#/components/schemas/CollectionMapping'
        rejected_titles:
          type: array
          items:
            $ref: '#/components/schemas/SyncRejected'
      required:
      - sync_id
      - saved_created
      - saved_merged
      - collections_created
      - memberships_created
      - collection_mappings
      - rejected_titles
      example:
        sync_id: d660fc0b-25be-4ea1-9a70-d8b45b4efc24
        saved_created: 1
        saved_merged: 0
        collections_created: 1
        memberships_created: 1
        collection_mappings:
        - client_id: 0b04e83e-f4ef-44db-840e-9b494f007c99
          collection_id: 0b04e83e-f4ef-44db-840e-9b494f007c99
        rejected_titles: []
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
            request_id:
              type: string
          required:
          - code
          - message
          - fields
          - request_id
      required:
      - error
      example:
        error:
          code: validation_error
          message: Invalid request.
          fields:
            year_to:
            - Must be at least year_from.
          request_id: req-example
    Health:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - ok
        service:
          type: string
          enum:
          - CineScope API
      required:
      - status
      - service
      example:
        status: ok
        service: CineScope API
    DbHealth:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - ok
          - error
        database:
          type: string
          enum:
          - connected
          - unavailable
      required:
      - status
      - database
      example:
        status: ok
        database: connected
    Sample:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        message:
          type: string
      required:
      - id
      - name
      - message
      example:
        id: 1
        name: CineScope database demo
        message: Hello from PostgreSQL!
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
      description: Django HttpOnly session cookie. Use credentials:include. All unsafe operations additionally require
        X-CSRFToken and the CSRF cookie; no bearer tokens/localStorage auth tokens.
x-auth-deployment:
  recommended: same-origin proxy; React /api/* and /accounts/* to Django
  callback_path: /accounts/google/login/callback/
  local_google_redirect_uri: http://localhost:8000/accounts/google/login/callback/
  cookies:
    session: HttpOnly; Secure; SameSite=Lax; Path=/; host-only
    csrf: Secure; SameSite=Lax; Path=/; host-only; masked token from JSON
  unsafe_requests: CSRF cookie plus X-CSRFToken
  cors: Exact React origin and credentials=true only for direct same-site custom-subdomain calls
  separate_vercel_domains: Not reliable for a shared session
x-genre-filtering:
  user_selected_operator: AND
  tmdb_with_genres_separator: comma
  unmappable_key: Excludes that media branch
  tv_combined_categories: TV action/adventure and sci-fi/fantasy are broader upstream categories
x-mood-rules:
  version: moods-v2
  mappings:
  - key: feel_good
    label: Feel-Good
    genre_keys:
    - comedy
    - animation
    - family
    genre_operator: OR
    keyword_ids: []
  - key: mind_bending
    label: Mind-Bending
    genre_keys:
    - sci-fi
    - mystery
    - fantasy
    genre_operator: OR
    keyword_ids: []
  - key: dark
    label: Dark
    genre_keys:
    - thriller
    - horror
    - crime
    genre_operator: OR
    keyword_ids: []
  - key: relaxing
    label: Relaxing
    genre_keys:
    - comedy
    - family
    - documentary
    genre_operator: OR
    keyword_ids: []
  - key: family_night
    label: Family Night
    genre_keys:
    - animation
    - family
    genre_operator: AND
    keyword_ids: []
  keyword_ids: []
x-automatic-collections:
  ids:
  - auto:genre:<key>
  - auto:decade:<YYYY>
  - auto:highly-rated
  - auto:movies
  - auto:tv
  - auto:watched
  highly_rated: TMDB rating >= 8.0
  empty_groups: omitted
  mutations: forbidden
  sharing: custom collections only
x-public-share-flow:
  url_template: FRONTEND_PUBLIC_ORIGIN/shared/<token>
  json_api: /api/v1/shared/{token}/
  public_reads: credentials omitted
  trailers: Public title details API then YouTube embed; no authentication; never forward share token to external
    services.
x-tmdb-fetch-policy:
  list_calls_max: 2
  source_candidates_max: 40
  runtime_candidates_max: 6
  runtime_hydration_calls_max: 6
  outbound_attempts_max: 8
  concurrency_max: 3
  deadline_seconds: 15
  snapshot_ttl_seconds: 300
  all_media_split:
    movie: 20
    tv: 20
  followup_pages: PostgreSQL snapshot only; no upstream calls
  runtime_window: Deterministic six before cache lookup; three per All branch
  optional_list_hydration: No credits/videos/providers/keywords on catalogue cards
