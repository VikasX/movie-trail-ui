  /api/v1/auth/oauth/start/:
    post:
      tags:
      - Authentication
      operationId: startOAuth
      summary: Create server-bound OAuth state and return provider authorization URL.
      description: 'Create server-bound OAuth state and return provider authorization URL.


        Validation: Provider must be configured; return_to is an enum, never an arbitrary URL. State bound to browser,
        single use, ten-minute expiry; authorization code flow with PKCE where supported.


        Data source: Django security + django-allauth Google configuration


        Delegate URL/state/session construction to django-allauth Google with PKCE. redirect_uri is the canonical
        public origin plus /accounts/google/login/callback/, never an independent facade callback.'
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthRedirect'
              example:
                authorization_url: https://accounts.google.com/o/oauth2/v2/auth?state=example
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
