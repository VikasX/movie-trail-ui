                  request_id: req-example
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              example: 30
      x-data-source: PostgreSQL + email provider
      parameters:
      - name: X-CSRFToken
        in: header
        required: true
        description: Masked token from GET /auth/csrf/; required with CSRF cookie on unsafe browser requests.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
