  /api/v1/me/guest-sync/:
    post:
      tags:
      - Synchronization
      operationId: syncGuestLibrary
      summary: Merge validated guest library and collections without deleting account data.
      description: 'Merge validated guest library and collections without deleting account data.


        Validation: Idempotency key is sync_id in body; same user/key/body replays original result for 24h, changed
        body returns 409. Max 1 MiB body, 500 distinct titles, 20 collections, 2000 memberships. Full merge rules
        below. Reject malformed/duplicate payload entries with 400; transient upstream failures abort writes with
        503.


        Data source: PostgreSQL atomic merge + TMDB for unknown identities'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
              example:
                sync_id: d660fc0b-25be-4ea1-9a70-d8b45b4efc24
                saved_created: 1
                saved_merged: 0
                collections_created: 1
                memberships_created: 1
                collection_mappings:
                - client_id: 0b04e83e-f4ef-44db-840e-9b494f007c99
                  collection_id: 0b04e83e-f4ef-44db-840e-9b494f007c99
                rejected_titles: []
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: validation_error
                  message: Invalid input
                  fields: {}
                  request_id: req-example
