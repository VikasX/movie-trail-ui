openapi: 3.0.3
info:
  title: CineScope planned API contract
  version: 1.0.0-draft.2
  description: DESIGN ONLY. Most operations are proposals and are not implemented. See API_CONTRACT.md for normative
    flows, bounded discovery, security and persistence decisions. Existing /health/, /health/db/ and /samples/ retain
    scaffold behavior. All examples are illustrative, not live metadata.
servers:
- url: https://movie-trail-py.vercel.app
  description: Current backend origin; proposed operations are not deployed
- url: http://127.0.0.1:8000
  description: Local development
tags:
- name: System
- name: Metadata
- name: Authentication
- name: Discovery
- name: Details
- name: Activity
- name: Library
- name: Collections
- name: Sharing
- name: Synchronization
paths:
  /api/v1/health/:
    get:
      tags:
      - System
      operationId: health
      summary: Check process liveness (existing).
      description: 'Check process liveness (existing).


        Validation: Unknown query/body fields are rejected; apply global limits.


        Data source: Django'
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                service: CineScope API
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: rate_limited
                  message: Rate limited
                  fields: {}
                  request_id: req-example
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              example: 30
      x-data-source: Django
  /api/v1/health/db/:
    get:
      tags:
      - System
      operationId: databaseHealth
      summary: Check PostgreSQL connectivity (existing).
      description: 'Check PostgreSQL connectivity (existing).


        Validation: Unknown query/body fields are rejected; apply global limits.


        Data source: PostgreSQL SELECT 1'
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbHealth'
              example:
                status: ok
                database: connected
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: rate_limited
                  message: Rate limited
                  fields: {}
                  request_id: req-example
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              example: 30
        '503':
          description: Database unavailable; legacy health envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbHealth'
              example:
                status: error
                database: unavailable
      x-data-source: PostgreSQL SELECT 1
  /api/v1/samples/:
    get:
      tags:
      - System
      operationId: samples
      summary: Read existing demonstration rows; temporary scaffold route, not product data.
      description: 'Read existing demonstration rows; temporary scaffold route, not product data.


        Validation: Unknown query/body fields are rejected; apply global limits.


        Data source: PostgreSQL'
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sample'
              example:
              - id: 1
                name: CineScope database demo
                message: Hello from PostgreSQL!
        '429':
          description: Rate limited
          content:
