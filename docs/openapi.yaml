                    type: string
                required:
                - detail
              example:
                detail: Database unavailable.
      x-data-source: PostgreSQL
  /api/v1/metadata/:
    get:
      tags:
      - Metadata
      operationId: metadata
      summary: Load supported filters, moods and attribution.
      description: 'Load supported filters, moods and attribution.


        Validation: Unknown query/body fields are rejected; apply global limits.


        Data source: TMDB configuration + Python mappings'
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metadata'
              example:
                genres:
                - key: drama
                  name: Drama
                languages:
                - code: en
                  name: English
                regions:
                - code: IN
                  name: India
                moods:
                - key: feel_good
                  label: Feel-Good
                  genre_keys:
                  - comedy
                  - animation
                  - family
                  keyword_ids: []
                - key: mind_bending
                  label: Mind-Bending
                  genre_keys:
                  - sci-fi
                  - mystery
                  - fantasy
                  keyword_ids: []
                - key: dark
                  label: Dark
                  genre_keys:
                  - thriller
                  - horror
                  - crime
                  keyword_ids: []
                - key: relaxing
                  label: Relaxing
                  genre_keys:
                  - comedy
                  - family
                  - documentary
                  keyword_ids: []
                - key: family_night
                  label: Family Night
                  genre_keys:
                  - animation
                  - family
                  keyword_ids: []
                mood_mapping_version: moods-v2
                attribution:
                  tmdb_notice: This product uses the TMDB API but is not endorsed or certified by TMDB.
                  tmdb_url: https://www.themoviedb.org
                  watch_providers: JustWatch
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: validation_error
                  message: Invalid input
                  fields: {}
                  request_id: req-example
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: rate_limited
                  message: Rate limited
                  fields: {}
                  request_id: req-example
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              example: 30
        '502':
          description: Invalid upstream response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: upstream_invalid
                  message: Invalid upstream response
                  fields: {}
                  request_id: req-example
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: service_unavailable
                  message: Service unavailable
                  fields: {}
                  request_id: req-example
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              example: 30
        '504':
          description: Upstream timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: upstream_timeout
                  message: Upstream timeout
                  fields: {}
                  request_id: req-example
      x-data-source: TMDB configuration + Python mappings
      parameters:
      - name: language
        in: query
        required: false
        description: TMDB-supported BCP-47 display locale; not original-language filtering.
        schema:
          type: string
          default: en-US
      - name: region
        in: query
        required: false
        description: Supported ISO 3166-1 alpha-2 region; preferences override default when omitted.
        schema:
          type: string
          pattern: ^[A-Z]{2}$
          default: IN
